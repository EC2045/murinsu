<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>問いを作るカード</title>
    <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="src/style_185422fa.css">
</head>
<body class="p-4 md:p-8">
    <div class="max-w-2xl mx-auto">
        <header class="text-center mb-12">
            <h1 class="serif text-3xl font-bold mb-2">問いを作るカード</h1>
            <p class="text-gray-500 text-sm italic">― ムリンス開発・架空疑問生成器 ―</p>
        </header>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <!-- Theme Card Slot -->
            <div class="card" onclick="drawTheme()">
                <div id="theme-display" class="card-inner theme-card serif text-lg font-bold">
                    テーマを引く
                </div>
                <p class="text-center text-xs text-gray-400 mt-2">🟥 THEME (対象)</p>
            </div>

            <!-- Question Card Slot -->
            <div class="card" onclick="drawQuestion()">
                <div id="question-display" class="card-inner question-card serif text-lg font-bold">
                    クエスチョンを引く
                </div>
                <p class="text-center text-xs text-gray-400 mt-2">🟦 QUESTION (問い)</p>
            </div>
        </div>

        <!-- Result Display -->
        <div id="result-container" class="hidden bg-white p-6 rounded-xl shadow-inner border border-gray-200 mb-8 fade-in">
            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">生成された問い</h2>
            <div id="combined-text" class="serif text-xl md:text-2xl mb-6 leading-relaxed">
                <!-- Text Injected Here -->
            </div>
            
            <div class="space-y-4">
                <textarea id="caption-input" rows="3" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-gray-300 outline-none transition" placeholder="この問いに対する解説やキャプションを自由に書き留めてください..."></textarea>
                <button onclick="saveArchive()" class="w-full bg-black text-white py-2 rounded-lg hover:bg-gray-800 transition font-bold">思考のアーカイブに保存する</button>
            </div>
        </div>

        <!-- Archive -->
        <div class="mt-12">
            <div class="flex justify-between items-center mb-4 border-b border-gray-300 pb-2">
                <h3 class="serif text-xl font-bold">架空疑問のアーカイブ</h3>
                <span id="counter" class="text-xs font-mono bg-gray-200 px-2 py-1 rounded">Count: 0</span>
            </div>
            <div id="archive-list" class="space-y-4">
                <p class="text-center text-gray-400 py-8 italic">まだ保存された問いはありません。</p>
            </div>
        </div>
    </div>
  <script src="src/script_78d85e86.js"></script>
</body>
</html>
